[package]
name = "balanced_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
balanced_store.workspace = true
icu_calendar.workspace = true
iso_currency.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
balanced_store = { workspace = true, features = ["test-support"] }
insta.workspace = true
rust_decimal_macros.workspace = true
tempfile.workspace = true

[features]
# `NewTransaction::split_for_tests`, `SplitLine::for_tests` and
# `Ledger::open_with_migrations`, for tests outside the crate's own code.
test-support = ["balanced_store/test-support"]

# Posts split transactions, which need `test-support`.
[[test]]
name = "data_file"
required-features = ["test-support"]

# Upgrades files through migrations of its own, which need `test-support`.
[[test]]
name = "upgrade"
required-features = ["test-support"]

[lints]
workspace = true
