[package]
name = "balanced_store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# `cache` keeps the prepared INSERTs a large account is written with.
rusqlite = { workspace = true, features = ["cache"] }
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true
sqllogictest.workspace = true
tempfile.workspace = true

[features]
# `Store::balance_on`, for `balanced_core`'s tests of the balance as of a date;
# `Store::create_with_migrations`, `Store::open_with_migrations` and the migrations
# themselves, for tests that upgrade a file through steps of their own.
test-support = []

[[test]]
name = "slt"
harness = false

[[test]]
name = "upgrade"
required-features = ["test-support"]

[lints]
workspace = true
