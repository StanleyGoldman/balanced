[package]
name = "balanced_ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
balanced_core.workspace = true
balanced_i18n.workspace = true
# Finds the Documents folder the save picker starts in.
directories.workspace = true
# `persistence` saves the window layout and geometry in eframe storage.
eframe = { workspace = true, features = ["persistence"] }
egui_extras.workspace = true
i18n-embed-fl.workspace = true
icu_calendar.workspace = true
jiff.workspace = true
icu_locale.workspace = true
# Waits for `rfd`'s native file picker on a worker thread.
pollster.workspace = true
rfd.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
egui-wgpu = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
egui_kittest = { workspace = true, optional = true, features = ["snapshot", "wgpu"] }

[features]
# `balanced_ui::testing`, for UI tests: unfolding the Account bar's rail, and for the
# image snapshot tests the App on the lavapipe renderer and the snapshot check with the
# project thresholds; and sending the Commands that create and open a data file, which the
# native file picker sends in the app. `App::on_ledger`, the App on a ledger with no data
# file. `PreferencesFile::for_tests` and `RecentFilesFile::for_tests`, the files in a
# temporary directory.
test-support = ["dep:egui-wgpu", "dep:egui_kittest", "dep:tempfile", "balanced_i18n/test-support"]

[dev-dependencies]
egui_kittest.workspace = true
balanced_core = { workspace = true, features = ["test-support"] }
balanced_i18n = { workspace = true, features = ["test-support"] }
icu_locale.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
tempfile.workspace = true

[[test]]
name = "snapshots"
required-features = ["test-support"]

# Every App test stops the clock on one day with `Clock::fixed`.
[[test]]
name = "account_actions"
required-features = ["test-support"]

[[test]]
name = "column_chooser"
