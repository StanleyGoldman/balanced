[default]
extend-ignore-re = [
  '\b[0-9a-f]{7,40}\b',  # git commit hashes
]

[default.extend-words]
alikes = "alikes"        # "look-alikes"
invokable = "invokable"  # quoted from Rerun's source
jod = "jod"              # ISO 4217 Jordanian dinar
oktober = "oktober"      # German for October, in locale tests
pn = "pn"                # the "PN" of "PNGs"
