[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-or-later WITH AdditionRef-Balanced-Plugin-Exception"

[workspace.dependencies]
anyhow = "1.0.104"
balanced_core = { path = "crates/balanced_core" }
balanced_i18n = { path = "crates/balanced_i18n" }
balanced_prototype_harness = { path = "crates/balanced_prototype_harness" }
balanced_store = { path = "crates/balanced_store" }
balanced_ui = { path = "crates/balanced_ui" }
directories = "6.0.0"
egui = { version = "0.36.2", default-features = false }
egui_extras = { version = "0.36.2", default-features = false }
egui-wgpu = { version = "0.36.2", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_kittest = { version = "0.36.2", features = ["eframe"] }
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = "0.10.1"
icu_calendar = "2.3.0"
icu_collator = "2.3.1"
icu_datetime = "2.3.0"
icu_decimal = { version = "2.3.0", features = ["ryu"] }
# Exact pin: every release breaks the API, so an upgrade is a deliberate change that the
# money snapshot tests in `balanced_i18n` make visible. See docs/practices/money.md.
icu_experimental = { version = "=0.6.0", default-features = false, features = ["compiled_data"] }
icu_locale = "2.3.1"
icu_provider = "2.3.1"
insta = "1.49.0"
iso_currency = "0.7.1"
jiff = "0.2.38"
# Default features: the XDG desktop portal on Linux, so no GTK is linked.
rfd = "0.17.2"
pollster = "1.0.1"
rust-embed = "8.13.0"
# No `serde` feature: the data file and its undo log hold amounts as integer minor units.
# Never `serde-float`.
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
rust_decimal_macros = "1.40.0"
# `bundled` compiles SQLite 3.53.2 into the app, so a rusqlite upgrade is also a SQLite upgrade.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sqllogictest = "0.29.1"
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
thiserror = "2.0.21"
tempfile = "3.27.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unic-langid = "0.9.6"
zerovec = "0.11.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.154"

[workspace.lints.rust]
unsafe_code = "deny"
unknown_lints = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Cherry-picked from `restriction` and `nursery`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
iter_over_hash_type = "warn"
let_underscore_must_use = "warn"
mem_forget = "warn"
mod_module_files = "warn"
needless_pass_by_ref_mut = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
str_to_string = "warn"
string_add = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
use_self = "warn"
wildcard_enum_match_arm = "warn"

# `pedantic` lints switched off, one reason each.
missing_errors_doc = "allow"  # internal crates with no outside callers; error enums document themselves
missing_panics_doc = "allow"  # panics are bugs by policy, so there is nothing to document
must_use_candidate = "allow"  # fires on nearly every getter; `#[must_use]` is added where ignoring is a bug

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.mutants]
inherits = "test"
debug = "none"
