# `cargo xtask deny` runs `cargo deny check`. Every `skip`, licence exception or advisory ignore
# carries a comment saying why.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Zlib",
]
unused-allowed-license = "allow"
exceptions = [
  # Reached only through `balanced_ui`'s `test-support` feature: egui_kittest's image diff
  # (dify) prints with it. It never ships in the app.
  { crate = "colored", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = true  # workspace crates are `publish = false` and carry no licence

[bans]
multiple-versions = "deny"  # catches a split egui/accesskit graph before it becomes a trait error
wildcards = "deny"
allow-wildcard-paths = true  # workspace path dependencies
deny = [
  # Layer rule (ARCHITECTURE.md): nothing below `balanced_ui` depends on egui or eframe.
  # `wrappers` lists the only crates allowed a direct dependency; any other path to
  # egui or eframe fails.
  { crate = "egui", wrappers = [
    "balanced_prototype_harness",
    "balanced_ui",
    "eframe",
    "egui-wgpu",
    "egui-winit",
    "egui_extras",
    "egui_glow",
    "egui_kittest",
    "egui_table",
  ] },
  { crate = "eframe", wrappers = ["balanced", "balanced_ui", "egui_kittest"] },
]
skip = [
  # png 0.18.1 (latest; via image, in balanced_prototype_harness) depends on miniz_oxide 0.8
  # directly and on 0.9 through its deflate backend. Drop this when png settles on one.
  { crate = "miniz_oxide@0.8.9", reason = "png 0.18.1 pulls both 0.8 and 0.9" },
  # Proc-macro and build-time only. ICU4X 2.3 (displaydoc) is on syn 3; i18n-embed's
  # macros, rust-embed and thiserror are still on syn 2. Drop this when they move.
  { crate = "syn@2.0.119", reason = "i18n-embed-fl, rust-embed and thiserror use syn 2; ICU4X uses syn 3" },
  # i18n-embed 0.16 and i18n-config 0.4.8 (latest) still use thiserror 1; Balanced is on 2.
  { crate = "thiserror@1.0.69", reason = "i18n-embed 0.16 and i18n-config 0.4.8 use thiserror 1" },
  { crate = "thiserror-impl@1.0.69", reason = "comes with thiserror 1, above" },
  # eframe 0.36.2's platform stack. Each crate below is an older copy that only an
  # eframe dependency still uses; drop the lot when an eframe upgrade leaves them unused.
  # accesskit_winit 0.32's per-OS adapters each pin their own accesskit_consumer. The
  # adapters keep it internal, so it never meets egui's accesskit types.
  { crate = "accesskit_consumer@0.35.0", reason = "accesskit_windows 0.32 (via eframe 0.36.2)" },
  { crate = "accesskit_consumer@0.36.0", reason = "accesskit_unix 0.21 (via eframe 0.36.2)" },
  { crate = "hashbrown@0.16.1", reason = "accesskit_consumer 0.35, above" },
  { crate = "objc2@0.5.3", reason = "accesskit_macos 0.26 and accesskit_winit 0.32 (via eframe 0.36.2)" },
  { crate = "objc2-app-kit@0.2.2", reason = "accesskit_macos 0.26 and accesskit_winit 0.32 (via eframe 0.36.2)" },
  { crate = "objc2-foundation@0.2.2", reason = "accesskit_macos 0.26 and accesskit_winit 0.32 (via eframe 0.36.2)" },
  { crate = "block2@0.5.1", reason = "objc2 0.5, above" },
  # winit 0.30 (via eframe 0.36.2) and accesskit_winit 0.32 use smithay-client-toolkit 0.19.
  { crate = "smithay-client-toolkit@0.19.2", reason = "winit 0.30 and accesskit_winit 0.32 (via eframe 0.36.2)" },
  { crate = "calloop@0.13.0", reason = "smithay-client-toolkit 0.19, above" },
  { crate = "calloop-wayland-source@0.3.0", reason = "smithay-client-toolkit 0.19 and winit 0.30 (via eframe 0.36.2)" },
  { crate = "rustix@0.38.44", reason = "calloop 0.13, above" },
  { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38, above" },
  { crate = "windows-sys@0.59.0", reason = "rustix 0.38, above" },
  { crate = "windows-sys@0.52.0", reason = "glutin 0.32 and eframe 0.36.2" },
  # Test-only: `balanced_ui`'s `test-support` feature brings egui_kittest's wgpu renderer
  # and its config reader. naga 30 (via wgpu 30) still uses rustc-hash 1, and
  # find-crate 0.6 (via i18n-embed-fl) still uses toml 0.5 beside egui_kittest's toml 1.
  { crate = "rustc-hash@1.1.0", reason = "naga 30 (via egui_kittest's wgpu renderer)" },
  { crate = "toml@0.5.11", reason = "find-crate 0.6 (via i18n-embed-fl) beside egui_kittest's toml 1" },
  { crate = "bitflags@1.3.2", reason = "core-graphics 0.23 (via winit 0.30, via eframe 0.36.2)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
