# The workflow runs the tasks `cargo xtask ci` runs, each as a step of its own
# so the Actions page shows which check failed and how long each took, spread
# over jobs that run in parallel: `clippy` and `test` each compile the
# workspace, and share little of that work, so neither waits for the other. A green
# local `cargo xtask ci` predicts a green run here. A check that belongs in CI
# belongs in that task's list, `STEPS` in xtask/src/ci.rs, and a test there
# fails until this file runs the same tasks. No task looks at the environment
# to behave differently here. Every step runs one xtask task in the CI image
# through .github/in-image.sh (ADR 0004, ADR 0010).
#
# Linux only. Release builds are made locally. Don't add a job that assumes
# Windows or macOS.
#
# Every job names its runner image, `ubuntu-26.04`, rather than
# `ubuntu-latest`, so GitHub doesn't move it on its own schedule. The checks
# run in the CI image, whose Ubuntu matches the snapshot machine (ADR 0004);
# the runner only supplies Docker. Move both together.
#
# The last job, `ci`, is the check for the `main` ruleset to require: it passes
# only when every other job passed or was skipped. Keep its name and the
# workflow's: renamed, a required check never arrives and every pull request
# waits on it.

name: ci

# Pull requests, and pushes to `main` so a merge is known green and two pull
# requests that break each other are caught. A push to any other branch only
# builds what its pull request is already building, so it starts nothing.
#
# No `paths` filter here. A workflow that never starts reports no status at
# all, so a required check would wait forever. Skipping work belongs on the
# jobs and steps.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run on its old head. Every run on
# `main` finishes, so each merge is known green or red.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Caching (ADR 0003, ADR 0010). `target/` is never persisted: it lives in
  # the checkout on a fresh runner, so every run starts empty. sccache caches
  # whole compiler outputs in the GitHub Actions cache, keyed by a hash of
  # their inputs, so it can't go stale. Don't add a cache for `target/`.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "on"
  ACTIONS_CACHE_SERVICE_V2: "on"
  # No idle timeout, so the server started by the first build is still the
  # one `--show-stats` asks at the end, however long the tests take.
  SCCACHE_IDLE_TIMEOUT: "0"
  # sccache can't cache a crate built incrementally, so with it on, every
  # workspace crate would compile from scratch each run.
  CARGO_INCREMENTAL: "0"
  CI_CARGO_HOME: ${{ github.workspace }}/../cargo

jobs:
  # Whether anything but prose changed: Markdown anywhere, `docs/`, or agent
  # tooling under `.claude/`. The list names what to skip, not what to build,
  # so a file type nobody listed builds, and a diff git can't take counts as
  # code. A manual run has no changed files and skips the filter, so `code` is
  # empty and everything runs. The workflow decides this, never
  # `cargo xtask ci`, which doesn't look at the diff. `mutants.yml` skips the
  # same paths with `paths-ignore`; change both together.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Full history, for the merge base of a pull request's two ends.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A pull request's whole diff from its merge base, or a push's commits.
      - id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          RANGE: >-
            ${{ github.event_name == 'pull_request'
              && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
              || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          code=false
          while IFS= read -r file; do
            case "$file" in
              *.md | docs/* | .claude/*) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$RANGE" || echo "the diff failed")
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The checks that compile nothing of the workspace.
  checks:
    needs: changes
    runs-on: ubuntu-26.04
    steps:
      # Full history: `dco` walks every commit since its cutoff. On a pull
      # request this checks out GitHub's merge of the branch into its target,
      # so `adrs` checks the merged tree, where two pull requests that each add
      # a record with the same number clash. On a stacked pull request the
      # target is the layer below; the push run on `main` catches a clash once
      # the layers land.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup

      # These two run on every change. They are the checks that read prose,
      # the spell-check and the record names under `docs/`, so a prose-only
      # change, which skips the rest, still gets them.
      - name: typos
        run: .github/in-image.sh cargo xtask typos
      - name: adrs
        run: .github/in-image.sh cargo xtask adrs

      - name: fmt
        if: needs.changes.outputs.code != 'false'
        run: .github/in-image.sh cargo xtask fmt
      - name: deny
        if: needs.changes.outputs.code != 'false'
        run: .github/in-image.sh cargo xtask deny
      - name: layers
        if: needs.changes.outputs.code != 'false'
        run: .github/in-image.sh cargo xtask layers
      - name: todo
        if: needs.changes.outputs.code != 'false'
        run: .github/in-image.sh cargo xtask todo
      - name: spdx
        if: needs.changes.outputs.code != 'false'
        run: .github/in-image.sh cargo xtask spdx
      - name: dco
        if: needs.changes.outputs.code != 'false'
        run: .github/in-image.sh cargo xtask dco
      - name: sccache summary
        if: always()
        run: .github/sccache-summary.sh

  clippy:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-setup
      - name: clippy
        run: .github/in-image.sh cargo xtask clippy
      - name: sccache summary
        if: always()
        run: .github/sccache-summary.sh

  # The three that build and run the test binaries, in one job so they build
  # them once.
  test:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-setup
      - name: test
        run: .github/in-image.sh cargo xtask test
      - id: snapshots
        name: snapshots
        run: .github/in-image.sh cargo xtask snapshots
      - name: locales
        run: .github/in-image.sh cargo xtask locales

      # The failing tests, as annotations on the lines that panicked and a
      # table in the job summary. Every step above runs nextest, which
      # rewrites junit.xml each time, and a failure skips the steps after it,
      # so the file holds the run that failed.
      - name: report failed tests
        if: failure()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: target/nextest/default/junit.xml
          annotate_only: true
          # A table of the failing tests alone, titled suite › test.
          detailed_summary: true
          include_skipped: false
          include_empty_in_summary: false
          simplified_summary: true
          check_title_template: "{{SUITE_NAME}} › {{TEST_NAME}}"

      # kittest's images of a failed snapshot, the drawing it got and its
      # difference from the committed one, so a mismatch can be seen without
      # reproducing it.
      - id: snapshot-diffs
        name: upload snapshot diffs
        if: failure() && steps.snapshots.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-diffs
          path: |
            crates/balanced_ui/tests/snapshots/*.new.png
            crates/balanced_ui/tests/snapshots/*.diff.png
          if-no-files-found: ignore
      - name: link snapshot diffs
        if: failure() && steps.snapshot-diffs.outputs.artifact-url != ''
        env:
          URL: ${{ steps.snapshot-diffs.outputs.artifact-url }}
        run: |
          {
            echo "### 🖼️ Snapshot diffs"
            echo
            echo "These snapshots failed. [Download snapshot-diffs]($URL) for each one's drawing (\`.new.png\`) and its difference from the committed image (\`.diff.png\`)."
            echo
            for diff in crates/balanced_ui/tests/snapshots/*.diff.png; do
              echo "- \`$(basename "$diff" .diff.png)\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: sccache summary
        if: always()
        run: .github/sccache-summary.sh

  # The required check. A job a prose-only change skips counts as passed.
  ci:
    needs: [changes, checks, clippy, test]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
