name: Mutants (PR)

# Advisory: missed mutants are reported in the step summary and do not fail the PR.
# Make it blocking once balanced_core and balanced_i18n reach zero missed mutants.

on:
  pull_request:
    paths:
      - "crates/balanced_core/**"
      - "crates/balanced_i18n/**"
      - "Cargo.*"
      - ".cargo/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: git diff "origin/${{ github.base_ref }}..." > git.diff
      - name: cargo mutants --in-diff
        run: |
          set +e
          cargo mutants --in-diff git.diff --in-place --no-shuffle -vV
          code=$?
          case $code in
            0) echo "No missed mutants in this diff." >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "Missed mutants (advisory): see mutants.out/missed.txt." >> "$GITHUB_STEP_SUMMARY" ;;
            3) echo "Mutants timed out (advisory): see mutants.out/timeout.txt." >> "$GITHUB_STEP_SUMMARY" ;;
            4) echo "The unmutated tree failed its tests; fix the test job first." >> "$GITHUB_STEP_SUMMARY" ;;
            *) exit $code ;;
          esac
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants.out
          path: mutants.out
