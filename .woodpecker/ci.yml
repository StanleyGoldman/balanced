# The pipeline calls `cargo xtask ci` rather than listing its steps, so that a
# green local run predicts a green pipeline. A check that belongs in CI belongs
# in that task, and the task never looks at the environment to behave
# differently here. The steps beside it rerun a check from that task on its
# own, so prose-only pull requests, which skip it, still get that check.
#
# Linux only. There is no Windows or macOS agent; release builds are made
# locally. Don't add a step that assumes one.
#
# Keep this file named `ci.yml`. Woodpecker names a workflow's check after its
# file, and branch protection is to require `ci/woodpecker/pr/ci`: renamed,
# every pull request waits for a check that never arrives and can't merge.

# Pull requests, and pushes to `main` so a merge is known green and two pull
# requests that break each other are caught. A push to any other branch only
# builds what its pull request is already building, so it starts nothing.
#
# No path filter here. A pipeline that never starts reports no status at all,
# so filtering the workflow would leave a pull request waiting on a required
# check forever. Skipping work belongs on the steps.
when:
  - event: pull_request
  - event: push
    branch: main

# Only the oldhermit agents. Scheduling is otherwise round-robin across the
# whole pool, and the CI image lives on oldhermit's Docker daemon alone, built
# there through its socket proxy; an agent on another host has neither.
# oldhermit-3 carries the required label `!lane=mutants`, so it takes only
# workflows that ask for `lane: mutants` and never this one. Don't add `lane`
# here.
labels:
  location: oldhermit

# The default clone fetches the one commit under test, with no history, so the
# `adrs` step below would find no merge base. This one fetches the full
# history, and on a pull request the target branch too, into
# `origin/<target branch>`. Steps get no forge credentials, so a step can't
# `git fetch` what the clone left out; anything a step reads from git is
# fetched here.
#
# Any tag of `woodpeckerci/plugin-git` is on the server's trusted-clone list,
# so this step still gets the credentials a private repository needs. Another
# image would clone with none and fail.
clone:
  - name: clone
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      partial: false
      fetch_target_branch: true

steps:
  # Builds the CI image on the Docker daemon the oldhermit agents share,
  # reached through the socket proxy every step container can see, so no
  # `privileged` flag. Cached on that daemon and nowhere else: no registry push
  # and no pull. With nothing changed every layer hits the cache and the step
  # takes about a second, and an image evicted from the daemon rebuilds
  # itself on the next run.
  #
  # No `when:` filter, ever. A step that depends on a step its `when:`
  # filtered out isn't a skipped dependency but a config error that rejects
  # the whole pipeline ("depends on step 'ci-image' which is filtered out by
  # its conditions"), and `woodpecker-cli lint` doesn't catch it. Every other
  # step needs this image, so a filter here is a filter on everything.
  - name: ci-image
    image: docker:27-cli
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      # The classic builder, which builds inside the daemon and keeps its
      # layers there. With BuildKit on, buildx reaches a `tcp://` daemon
      # through its `docker-container` driver: it starts its own BuildKit
      # container with a separate cache, which the socket proxy then refuses
      # ("unable to upgrade to tcp, received 403"), and even when it ran,
      # quicken_clone's copy re-pulled the base image every run and hit Docker
      # Hub's rate limit. The step logs a deprecation warning for this; it
      # stops working only when Docker removes the classic builder.
      DOCKER_BUILDKIT: "0"
    commands:
      # The build context is the two files the Dockerfile reads, not the
      # checkout, which a local `woodpecker-cli exec` would send whole,
      # `target/` included.
      - tar -c .woodpecker/Dockerfile rust-toolchain.toml | docker build -t balanced-ci:latest -f .woodpecker/Dockerfile -

  # Built by `ci-image` above, from .woodpecker/Dockerfile (ADR 0004).
  #
  # Skipped when every changed path is prose: Markdown anywhere, `docs/`, or
  # agent tooling under `.claude/`. The pipeline decides this, never
  # `cargo xtask ci`, which doesn't look at the diff. The list names what to
  # skip, not what to build, so a file type nobody listed builds. A skipped
  # step still reports the check green.
  #
  # Nothing may `depends_on` this step: a dependency on a step its `when:`
  # filtered out rejects the whole pipeline (see `ci-image`).
  #
  # Caching (ADR 0003). Two things outlive the step, both on the oldhermit
  # host and both under a `balanced/` directory: `/cache/agent` is mounted
  # into every repository's steps, and Woodpecker's cache folder is shared
  # with quicken_clone, so a path outside `balanced/` could have another
  # repository building into it.
  # - The cargo registry, as `CARGO_HOME`: downloaded crate sources, which
  #   never change for a version. cargo locks it, so concurrent steps share it
  #   safely. The tools stay on `PATH` in the image's own CARGO_HOME.
  # - sccache's directory, on the `/cache/agent` folder every oldhermit agent
  #   mounts from one host folder, so `ci` hits what the other agent compiled
  #   whichever of the two it lands on. No directory per agent and no
  #   fallback: an agent without `/cache/agent` builds cold into the
  #   container, which is slow but correct.
  #
  # `target/` is never persisted. On the agents it stays in the checkout inside
  # this container, so every run starts empty. quicken_clone's persistent target
  # directories kept corrupting (link failures from a cached rlib that no
  # longer matched its sources) and failed every pipeline on that agent until
  # someone wiped them by hand; concurrent builds sharing one invalidated
  # each other too. sccache stores whole compiler outputs keyed by a hash of
  # their inputs, so it can't go stale that way. See
  # docs/adr/0003-ci-caches-with-sccache-not-a-persistent-target.md. Don't add
  # a volume or `CARGO_TARGET_DIR` for it.
  - name: ci
    image: balanced-ci:latest
    depends_on: [ci-image]
    when:
      - path:
          exclude: ["**/*.md", "docs/**", ".claude/**"]
    volumes:
      - /var/lib/woodpecker/cache/balanced/cargo:/cache/cargo
    environment:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /cache/cargo
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /cache/agent/balanced/sccache
      # Each sccache server enforces this on its own, and two `ci` steps can
      # run at once, so the directory can overshoot it (ADR 0003).
      SCCACHE_CACHE_SIZE: 10G
      # No idle timeout, so the server started by the first build is still
      # the one `--show-stats` asks at the end, however long the tests take.
      SCCACHE_IDLE_TIMEOUT: "0"
      # sccache can't cache a crate built incrementally, so with it on, every
      # workspace crate would compile from scratch each run.
      CARGO_INCREMENTAL: "0"
    commands:
      # Woodpecker runs a step's commands as one shell script, so this trap
      # prints the hit rate when `cargo xtask ci` ends, pass or fail, and
      # leaves the step's exit status as the build's.
      - trap 'sccache --show-stats || true' EXIT
      - cargo xtask ci

  # The spell-check, on every pipeline, unfiltered. It is the one check in
  # `cargo xtask ci` that reads the text of Markdown, so a prose-only pull
  # request, which skips `ci` above, still needs it. `adrs`, which looks at
  # the ADR file names under `docs/`, has its own unfiltered step below. When
  # `ci` runs too, both checks run twice.
  #
  # Depends on `ci-image` only. Not on `ci`, whose filter would reject the
  # pipeline whenever it skips, and `ci` not on this, so neither waits for
  # the other.
  - name: typos
    image: balanced-ci:latest
    depends_on: [ci-image]
    commands:
      - cargo xtask typos

  # Two pull requests can each add a record with the same number and both go
  # green, since the file names differ, so the clash exists only in the merged
  # tree. A pull request checks its branch merged with its target. A push to
  # `main` checks `main` itself, the backstop for two pull requests that both
  # went green before either landed.
  #
  # On a stacked pull request the target is the layer below, not `main`, so a
  # clash with `main` shows up only once the layers land; the push run catches
  # it then.
  #
  # Unfiltered, and no `depends_on` link with `ci`: records arrive in
  # prose-only pull requests, which still need this check.
  #
  # Write the target branch variable without braces. Woodpecker substitutes the
  # braced form when it parses this file, comments included; the bare form
  # reaches the shell, which expands it.
  - name: adrs
    image: balanced-ci:latest
    depends_on: [ci-image]
    environment:
      CARGO_TERM_COLOR: always
    commands:
      - if [ "$CI_PIPELINE_EVENT" = pull_request ]; then cargo xtask adrs --against "origin/$CI_COMMIT_TARGET_BRANCH"; else cargo xtask adrs; fi
